<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0906;
    --amber-1:#af8a00;
    --amber-2:#c5b91b;
    --cream:#f4ecd8;
    --muted:#b8ab84;
    --card-surface: rgba(20,16,8,.55);
    --card-surface-hover: rgba(27,21,10,.72);
    --border-line: rgba(197,185,27,.26);
    --border-line-hover: rgba(197,185,27,.62);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--void); color:var(--cream); font-family:'Space Grotesk',sans-serif; }
  #bg{ position:fixed; inset:0; z-index:0; }
  #bg::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(6,5,3,.5) 75%);
  }

  .page{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:22px clamp(20px,4vw,56px); flex-wrap:wrap;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:rgba(11,9,6,.35); border-bottom:1px solid var(--border-line);
  }
  .wordmark{
    font-family:'Fraunces',serif; font-optical-sizing:auto; font-weight:600;
    font-size:1.55rem; color:var(--cream); display:flex; align-items:baseline; gap:.45rem;
  }
  .wordmark em{ color:var(--amber-2); font-style:italic; font-weight:500; }

  .search-wrap{ position:relative; flex:1 1 320px; max-width:420px; }
  .search-wrap input{
    width:100%; padding:11px 16px 11px 40px; border-radius:8px;
    border:1px solid var(--border-line); background:rgba(9,7,4,.55);
    color:var(--cream); font:inherit; font-size:.95rem; outline:none;
    transition:border-color .18s ease, background .18s ease;
  }
  .search-wrap input::placeholder{ color:var(--muted); }
  .search-wrap input:focus{ border-color:var(--amber-2); background:rgba(9,7,4,.78); }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--muted); pointer-events:none; }

  main{ flex:1; padding:40px clamp(20px,4vw,56px) 90px; }
  .heading{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(1.6rem,3vw,2.2rem); margin:0 0 6px; }
  .subheading{ color:var(--muted); margin:0 0 32px; font-size:.95rem; max-width:56ch; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }

  .card{
    position:relative; border-radius:10px; border:1px solid var(--border-line);
    background:var(--card-surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    overflow:hidden; cursor:pointer; text-align:left; padding:0; margin:0;
    font:inherit; color:inherit; width:100%;
    transition:border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .card:hover, .card:focus-visible{ border-color:var(--border-line-hover); background:var(--card-surface-hover); transform:translateY(-3px); }
  .card:focus-visible{ outline:2px solid var(--amber-2); outline-offset:2px; }
  .card .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:rgba(255,255,255,.03); }
  .card .meta{ padding:14px 16px 16px; }
  .card .name{ font-size:1rem; font-weight:500; margin:0; }
  .card .play{
    font-size:.78rem; color:var(--amber-2); margin:6px 0 0;
    opacity:0; transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .card:hover .play, .card:focus-visible .play{ opacity:1; transform:none; }

  .state{ color:var(--muted); padding:70px 0; text-align:center; font-size:.95rem; grid-column:1/-1; }

  .modal-scrim{
    position:fixed; inset:0; z-index:20; background:rgba(5,4,2,.84);
    display:flex; align-items:center; justify-content:center; padding:clamp(12px,3vw,40px);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-scrim.open{ opacity:1; pointer-events:auto; }
  .modal{
    position:relative; width:min(1000px,100%); height:min(720px,88vh);
    background:#050403; border:1px solid var(--border-line-hover); border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.6); display:flex; flex-direction:column;
    overflow:hidden; transform:scale(.96); transition:transform .2s ease;
  }
  .modal-scrim.open .modal{ transform:scale(1); }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--border-line); background:rgba(11,9,6,.6);
  }
  .modal-head .name{ font-family:'Fraunces',serif; font-size:1.05rem; }
  .modal-close{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border-line);
    background:transparent; color:var(--cream); cursor:pointer; font-size:.95rem;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .modal-close:hover, .modal-close:focus-visible{ border-color:var(--amber-2); color:var(--amber-2); }
  .modal-body{ position:relative; flex:1; background:#000; }
  .modal-body iframe{ width:100%; height:100%; border:0; display:block; }
  .modal-status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:var(--muted); font-size:.9rem;
    background:#050403; text-align:center; padding:0 24px;
  }
  .spinner{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--border-line);
    border-top-color:var(--amber-2); animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .retry-btn{
    padding:8px 18px; border-radius:6px; border:1px solid var(--border-line-hover);
    background:transparent; color:var(--cream); cursor:pointer; font:inherit;
  }
  .retry-btn:hover{ border-color:var(--amber-2); color:var(--amber-2); }

  @media (prefers-reduced-motion:reduce){
    .card, .modal-scrim, .modal, .spinner, .play{ transition:none; animation:none; }
  }
  @media (max-width:560px){
    .topbar{ flex-direction:column; align-items:stretch; }
    .search-wrap{ max-width:none; }
  }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    padding: 0.6rem 3.2rem 0.25rem;
    border-radius: 16px 16px 0 0;
    background: rgba(10, 10, 10, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: none;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  .bottom-bar.hidden {
    transform: translate(-50%, 140%);
    opacity: 0;
    pointer-events: none;
  }

  .bar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.03);
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }

  .bar-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .bar-btn svg {
    width: 17px;
    height: 17px;
  }

  .bar-toggle {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    width: 38px;
    height: 16px;
    border: none;
    border-radius: 999px 999px 0 0;
    background: rgba(10, 10, 10, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: bottom 0.4s ease;
  }

  .bar-toggle.bar-visible {
    bottom: 50px;
  }

  .bar-toggle svg {
    width: 11px;
    height: 11px;
    stroke: rgba(255, 255, 255, 0.7);
    transition: transform 0.4s ease;
  }

  .bar-toggle.bar-visible svg {
    transform: rotate(180deg);
  }
</style>
</head>
<body>
<div id="bg"></div>

<div class="page">
  <header class="topbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search games…" autocomplete="off">
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>
</div>

<div class="modal-scrim" id="modalScrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-head">
      <span class="name" id="modalName"></span>
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<nav class="bottom-bar" id="bottomBar">
  <a href="index.svg" class="bar-btn" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"></path>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"></path>
    </svg>
  </a>
  <a href="" class="bar-btn" aria-label="Games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="8" width="19" height="10" rx="4"></rect>
      <line x1="7" y1="11" x2="7" y2="15"></line>
      <line x1="5" y1="13" x2="9" y2="13"></line>
      <circle cx="16" cy="11.5" r="0.9" fill="currentColor" stroke="none"></circle>
      <circle cx="18.2" cy="14" r="0.9" fill="currentColor" stroke="none"></circle>
    </svg>
  </a>
  <a href="browser.svg" class="bar-btn" aria-label="Browser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"></circle>
      <line x1="15.2" y1="15.2" x2="20.5" y2="20.5"></line>
    </svg>
  </a>
</nav>

<button class="bar-toggle bar-visible" id="barToggle" aria-label="Toggle bottom bar">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
<script>
  VANTA.CELLS({
    el: "#bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    color1: 0xaf8a00,
    color2: 0xc5b91b,
    size: 5.00,
    speed: 2.00
  })
</script>

<script>
function initGamesPage(){
  var grid = document.getElementById('grid');
  var searchInput = document.getElementById('search');
  var modalScrim = document.getElementById('modalScrim');
  var modalBody = document.getElementById('modalBody');
  var modalName = document.getElementById('modalName');
  var modalClose = document.getElementById('modalClose');

  var games = [];
  var gamesLoaded = false;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderGrid(list){
    grid.innerHTML = '';
    if(!list.length){
      var state = document.createElement('div');
      state.className = 'state';
      state.textContent = gamesLoaded
        ? (games.length ? 'yo try finding a real game dude' : 'nah boi add sum games')
        : 'loading le games…';
      grid.appendChild(state);
      return;
    }
    list.forEach(function(game){
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.innerHTML =
        '<img class="thumb" src="' + escapeHtml(game.thumbnail || '') + '" alt="' + escapeHtml(game.name || 'Game') + ' thumbnail" loading="lazy" onerror="this.style.opacity=0.12">' +
        '<div class="meta">' +
          '<p class="name">' + escapeHtml(game.name || 'Untitled') + '</p>' +
          '<p class="play">Click to play</p>' +
        '</div>';
      card.addEventListener('click', function(){ openGame(game); });
      grid.appendChild(card);
    });
  }

  function filterGames(){
    var q = searchInput.value.trim().toLowerCase();
    var filtered = q ? games.filter(function(g){ return (g.name || '').toLowerCase().indexOf(q) !== -1; }) : games;
    renderGrid(filtered);
  }
  searchInput.addEventListener('input', filterGames);

  function loadGames(){
    fetch('https://cdn.jsdelivr.net/gh/blockfreeubg/fluxv3@latest/games.json')
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        games = Array.isArray(data) ? data : [];
        gamesLoaded = true;
        renderGrid(games);
      })
      .catch(function(){
        gamesLoaded = true;
        grid.innerHTML = '';
        var state = document.createElement('div');
        state.className = 'state';
        state.textContent = "yo games.json is messed up or not there dude";
        grid.appendChild(state);
      });
  }

  function openGame(game){
    modalName.textContent = game.name || 'Game';
    modalScrim.classList.add('open');
    modalScrim.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
    setStatus('<div class="spinner"></div><span>Loading ' + escapeHtml(game.name || 'game') + '…</span>');
    fetchAndRun(game);
  }

  function setStatus(innerHtml){
    modalBody.innerHTML = '<div class="modal-status">' + innerHtml + '</div>';
  }

  function fetchAndRun(game){
    fetch(game.url)
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(code){
        var trimmed = code.trim();
        var html;
        if(/^<!doctype html/i.test(trimmed) || /^<html[\s>]/i.test(trimmed)){
          // the url served a full, self-contained page — preview it as-is
          html = code;
        } else {
          // the url served a bare script — give it a canvas to draw into
          var safeCode = code.replace(/<\/script/gi, '<\\/script');
          html =
            '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
            'html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}' +
            'canvas{max-width:100%;max-height:100%;}' +
            '</style></head><body>' +
            '<canvas id="canvas" width="640" height="480"></canvas>' +
            '<script>' + safeCode + '<' + '/script>' +
            '</body></html>';
        }
        modalBody.innerHTML = '';
        var iframe = document.createElement('iframe');
        iframe.setAttribute('sandbox', 'allow-scripts allow-pointer-lock allow-forms');
        iframe.setAttribute('allow', 'autoplay; fullscreen; gamepad');
        iframe.srcdoc = html;
        modalBody.appendChild(iframe);
      })
      .catch(function(err){
        setStatus(
          '<span>Couldn\'t load this game (' + escapeHtml(err.message) + ').</span>' +
          '<button class="retry-btn" id="retryBtn" type="button">Try again</button>'
        );
        document.getElementById('retryBtn').addEventListener('click', function(){ fetchAndRun(game); });
      });
  }

  function closeModal(){
    modalScrim.classList.remove('open');
    modalScrim.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    modalBody.innerHTML = '';
  }
  modalClose.addEventListener('click', closeModal);
  modalScrim.addEventListener('click', function(e){ if(e.target === modalScrim) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modalScrim.classList.contains('open')) closeModal();
  });

  loadGames();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initGamesPage);
} else {
  initGamesPage();
}

  const bottomBar = document.getElementById('bottomBar');
  const barToggle = document.getElementById('barToggle');

  barToggle.addEventListener('click', () => {
    const isHidden = bottomBar.classList.toggle('hidden');
    barToggle.classList.toggle('bar-visible', !isHidden);
  });
</script>
</body>
</html>
