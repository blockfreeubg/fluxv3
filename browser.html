<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>flux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, Montserrat, sans-serif;
            background: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #262626;
            border-bottom: 1px solid #0a0a0a;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        button {
            background: #444444;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #fff200;
            color: #393700;
        }

        button:active {
            transform: scale(0.95);
        }

        input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #3d3d3d;
            background: #1a1a1a;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0066cc;
        }

        .status {
            padding: 4px 12px;
            background: #3d3d3d;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            padding: 0.6rem 3.2rem 0.25rem;
            border-radius: 16px 16px 0 0;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .bottom-bar.hidden {
            transform: translate(-50%, 140%);
            opacity: 0;
            pointer-events: none;
        }

        .bar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .bar-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .bar-btn svg {
            width: 17px;
            height: 17px;
        }

        .bar-toggle {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 38px;
            height: 16px;
            border: none;
            border-radius: 999px 999px 0 0;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: bottom 0.4s ease;
        }

        .bar-toggle.bar-visible {
            bottom: 50px;
        }

        .bar-toggle svg {
            width: 11px;
            height: 11px;
            stroke: rgba(255, 255, 255, 0.7);
            transition: transform 0.4s ease;
        }

        .bar-toggle.bar-visible svg {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div id="bg"></div>
    <div class="container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="backBtn" title="Back">←</button>
                <button id="forwardBtn" title="Forward">→</button>
                <button id="reloadBtn" title="Reload">↻</button>
            </div>
            <input type="text" id="urlInput" placeholder="Enter URL..." value="">
            <button id="goBtn">Go</button>
            <div class="status" id="status">Ready</div>
        </div>
        <iframe id="browserFrame" title="Scramjet Browser"></iframe>
    </div>

    <nav class="bottom-bar" id="bottomBar">
        <a href="/" class="bar-btn" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 11.5 12 4l9 7.5"></path>
                <path
                    d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9">
                </path>
            </svg>
        </a>
        <a href="games.html" class="bar-btn" aria-label="Games">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2.5" y="8" width="19" height="10" rx="4"></rect>
                <line x1="7" y1="11" x2="7" y2="15"></line>
                <line x1="5" y1="13" x2="9" y2="13"></line>
                <circle cx="16" cy="11.5" r="0.9" fill="currentColor" stroke="none"></circle>
                <circle cx="18.2" cy="14" r="0.9" fill="currentColor" stroke="none"></circle>
            </svg>
        </a>
        <a href="browser.html" class="bar-btn" aria-label="Browser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <line x1="15.2" y1="15.2" x2="20.5" y2="20.5"></line>
            </svg>
        </a>
    </nav>

    <button class="bar-toggle bar-visible" id="barToggle" aria-label="Toggle bottom bar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </button>

    <!--
        STEP 1: Load the libraries. Keep these as plain <script> tags. Do not turn
        them into type="module" / imports. They put their API on the global object
        (window.$scramjet, window.$scramjetController, window.EpoxyTransport), and
        that only happens in a classic script.

        scramjet/ and controller/ need to live at your site root. The service worker
        loads scramjet.js and scramjet.wasm from /scramjet/ and the inject script
        from /controller/, so keep those paths unless you also change the controller
        config.
    -->
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <!-- Epoxy is the network transport. Drop in a local copy if you don't want the CDN. -->
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <script>
        // STEP 2: Pull the classes off the globals the scripts above set up.
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const iframe = document.getElementById("browserFrame");
        const urlInput = document.getElementById("urlInput");
        const statusEl = document.getElementById("status");

        // ---------------------------------------------------------------
        // WISP SERVER POOL
        // Add as many wisp endpoints here as you have access to. They are
        // tried in order on startup, and if the active one drops mid-session
        // the code below rotates to the next one automatically and keeps
        // cycling through the list (wrapping back to the start) until one
        // connects again.
        // ---------------------------------------------------------------
        const WISP_SERVERS = [
            "wss://wisp.mercurywork.shop/",
            "wss://wisp.bromine.cc/",
            "wss://wisp.classroom.lat/",
            "wss://anura.pro/"
        ];

        let scramjet = null;
        let frame = null;
        let currentIndex = -1;      // index into WISP_SERVERS currently in use
        let reconnecting = false;   // guards against overlapping reconnect attempts
        let pendingUrl = null;      // last URL requested, replayed after a rotation

        function setStatus(t, err = false) {
            statusEl.textContent = t;
            statusEl.style.color = err ? "#ff6b6b" : "#aaa";
        }

        function norm(u) {
            return u.startsWith("http") ? u : "https://" + u;
        }

        // Try to bring up a transport on a single wisp URL, with a timeout
        // so a server that's down doesn't hang init() forever.
        function connectTransport(wispUrl, timeoutMs = 6000) {
            return new Promise((resolve, reject) => {
                const transport = new EpoxyTransport({ wisp: wispUrl });
                let settled = false;

                const timer = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    reject(new Error(`Timed out connecting to ${wispUrl}`));
                }, timeoutMs);

                transport.init()
                    .then(() => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        resolve(transport);
                    })
                    .catch(e => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        reject(e);
                    });
            });
        }

        // Walk the WISP_SERVERS list starting just after `startAfterIndex`,
        // wrapping around, and return the first transport that connects.
        async function connectWithFailover(startAfterIndex = -1) {
            const count = WISP_SERVERS.length;
            let lastErr = null;

            for (let step = 1; step <= count; step++) {
                const idx = (startAfterIndex + step) % count;
                const wispUrl = WISP_SERVERS[idx];
                setStatus(`Connecting to wisp server ${idx + 1}/${count}...`);
                try {
                    const transport = await connectTransport(wispUrl);
                    currentIndex = idx;
                    return transport;
                } catch (e) {
                    console.warn(`Wisp server failed (${wispUrl}):`, e.message || e);
                    lastErr = e;
                }
            }

            throw lastErr || new Error("No wisp servers configured");
        }

        // Tear down the current controller/frame and rebuild against the
        // next available wisp server. Reuses whatever URL was last loaded
        // so the user doesn't lose their place.
        async function rotateWispServer() {
            if (reconnecting) return;
            reconnecting = true;
            setStatus("Wisp server down, rotating...", true);

            try {
                const transport = await connectWithFailover(currentIndex);

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                frame = scramjet.createFrame(iframe);
                frame.go(pendingUrl || "https://duckduckgo.com");

                setStatus(`Ready (wisp ${currentIndex + 1}/${WISP_SERVERS.length})`);
            } catch (e) {
                console.error("All wisp servers exhausted:", e);
                setStatus("All wisp servers are down", true);
            } finally {
                reconnecting = false;
            }
        }

        async function init() {
            try {
                setStatus("Initializing...");

                // Wait for the service worker (registered at the bottom) to be active.
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                // STEP 3/4: Connect a transport, trying each configured wisp
                // server in turn until one succeeds.
                const transport = await connectWithFailover(-1);

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                // STEP 5: Bind a frame to the <iframe> and navigate it.
                frame = scramjet.createFrame(iframe);
                pendingUrl = "https://duckduckgo.com";
                frame.go(pendingUrl);

                setStatus(`Ready (wisp ${currentIndex + 1}/${WISP_SERVERS.length})`);
            } catch (e) {
                console.error(e);
                setStatus(e.message, true);
            }
        }

        // Navigate the iframe to whatever is typed in the URL bar.
        function go() {
            const url = norm(urlInput.value);
            urlInput.value = url;
            pendingUrl = url;
            if (!frame) {
                rotateWispServer();
                return;
            }
            try {
                frame.go(url);
            } catch (e) {
                console.warn("Navigation failed, rotating wisp server:", e);
                rotateWispServer();
            }
        }

        document.getElementById("goBtn").onclick = go;

        urlInput.addEventListener("keydown", e => {
            if (e.key === "Enter") go();
        });

        // If the iframe itself throws or fails to load (a good proxy for
        // "the current wisp server just died"), rotate to the next one.
        iframe.addEventListener("error", () => {
            console.warn("Iframe error, rotating wisp server");
            rotateWispServer();
        });

        // Lightweight periodic health check: ping the active wisp server's
        // websocket endpoint every 15s, and rotate if it's unreachable.
        setInterval(() => {
            if (reconnecting || currentIndex === -1) return;
            const wispUrl = WISP_SERVERS[currentIndex];
            try {
                const ws = new WebSocket(wispUrl);
                const timer = setTimeout(() => {
                    ws.close();
                    rotateWispServer();
                }, 4000);
                ws.onopen = () => {
                    clearTimeout(timer);
                    ws.close();
                };
                ws.onerror = () => {
                    clearTimeout(timer);
                    rotateWispServer();
                };
            } catch (e) {
                rotateWispServer();
            }
        }, 15000);

        // STEP 6: Register the service worker, then boot once it's ready.
        // Service workers only run in a secure context: https:// or http://localhost.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(init);
        } else {
            setStatus("No service worker support", true);
        }

        const bottomBar = document.getElementById('bottomBar');
        const barToggle = document.getElementById('barToggle');

        barToggle.addEventListener('click', () => {
            const isHidden = bottomBar.classList.toggle('hidden');
            barToggle.classList.toggle('bar-visible', !isHidden);
        });
    </script>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
<script>
    VANTA.CELLS({
        el: "#bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        color1: 0xaf8a00,
        color2: 0xc5b91b,
        size: 5.00,
        speed: 2.00
    })
</script>
</html>
